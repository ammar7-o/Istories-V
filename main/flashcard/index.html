<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istories - flashcards</title>
    <link rel="stylesheet" href="../../font-awesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="../icon.png">
    <meta property="og:title" content="Istories">
    <meta property="og:description" content="Learn Languages Through Interactive Stories.">
    <meta property="og:image" content="https://ammar7-o.github.io/Istories-V/icon.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ammar7-o.github.io/Istories-V/">

    <!-- Shared sidebar navigation (nav/sidebar.js) -->
    <link rel="stylesheet" href="../nav/sidebar.css">
    <!-- Large user data (userStories, savedWords, userDictionaries, …) is stored in IndexedDB via localForage; must load before page scripts. -->
    <script src="../nav/vendor/localforage.min.js"></script>
    <script src="../nav/storage.js"></script>
    <script src="../nav/sidebar.js" defer></script>
    <script src="../nav/common.js"></script>
    <link rel="stylesheet" href="../nav/theme.css">
    <link rel="stylesheet" href="../nav/header.css">
</head>

<body>
    <header class="ist-header" id="top">
        <div class="ist-header__inner">
            <button class="ist-burger" id="toggle-nav" type="button" aria-label="Open navigation"
                aria-controls="istories-sidebar">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <a class="ist-header__brand" href="../../index.html">
                <img class="ist-header__logo" src="../../icon.svg" alt="">
                <span class="ist-header__name">IStories</span>
            </a>
            <span class="ist-header__page">
                <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                <span>Flashcards</span>
            </span>
            <div class="ist-header__spacer"></div>
            <a class="ist-header__action" id="settings-button" href="../settings/index.html" aria-label="Settings"
                title="Settings">
                <i class="fa-solid fa-gear" aria-hidden="true"></i>
            </a>
        </div>
    </header>

<main class="main-content">
        <div class="container">
            <!-- Home Page -->
            <div id="home" class="page active">

                <div class="flashcards-header">
                    
                    <h2>Flashcard Practice</h2>
                    <div class="flashcard-controls">
                        <button id="shuffleCards" class="btn btn-primary">
                            <i class="fas fa-random"></i> Shuffle
                        </button>
                        <button id="resetProgress" class="btn btn-primary">
                            <i class="fas fa-redo"></i> Reset Progress
                        </button>
                        
                    </div>
                </div>

                <div class="flashcard-toolbar">
                    <div class="flashcard-lang-filter">
                        <i class="fas fa-globe" aria-hidden="true"></i>
                        <select id="flashcardLangFilter" aria-label="Choose which language to practice">
                            <option value="all">🌍 All languages</option>
                        </select>
                    </div>
                    <span class="flashcard-lang-indicator" id="flashcardLangIndicator"></span>
                </div>

                <div class="flashcard-container">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-front">
                            <div class="flashcard-content">
                                <span class="flashcard-lang-badge story-lang-badge" id="flashcardLangBadge" hidden></span>
                                <h3 id="flashcardWord">No cards available</h3>
                                <p class="flashcard-context">Add words from stories to practice them here</p>
                            </div>
                            <div class="flashcard-hint">
                                <i class="fas fa-lightbulb"></i> Click or tap to flip
                            </div>
                        </div>
                        <div class="flashcard-back">
                            <div class="flashcard-content">
                                <h3 id="flashcardTranslation">No translation</h3>
                                <div class="flashcard-details">
                                    <div class="flashcard-pos" id="flashcardPos"></div>
                                    <!-- <div class="flashcard-definition" id="flashcardDefinition"></div>
                                    <div class="flashcard-example" id="flashcardExample"></div> -->
                                    <div class="flashcard-story" id="flashcardStory"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flashcard-actions">
                        <button id="cardAgain" class="card-btn card-again" disabled>
                            <i class="fas fa-times"></i> Again
                        </button>
                        <button id="cardHard" class="card-btn card-hard" disabled>
                            <i class="fas fa-meh"></i> Hard
                        </button>
                        <button id="cardGood" class="card-btn card-good" disabled>
                            <i class="fas fa-smile"></i> Good
                        </button>
                        <button id="cardEasy" class="card-btn card-easy" disabled>
                            <i class="fas fa-laugh"></i> Easy
                        </button>
                    </div>

                    <div class="progress-container">
                        <div class="progress-label">
                            <span>Session Progress</span>
                            <span id="progressText">0/0</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="flashcard-stats">
                    <div class="stat-card">
                        <div class="stat-number" id="dueCards">0</div>
                        <div class="stat-label">Due Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalCards">0</div>
                        <div class="stat-label">Total Cards</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="masteredCards">0</div>
                        <div class="stat-label">Mastered</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="learningCards">0</div>
                        <div class="stat-label">Learning</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="logo">
                    <img src="../../icon.svg" alt="">
                    <span>IStories</span>
                </div>
                <div class="footer-links">
                    <a target="_blank" href="https://ammar7-o.github.io/RAME/#">About</a>

                </div>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>

</body>

</html>
