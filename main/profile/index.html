<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — IStories</title>
    <link rel="stylesheet" href="../../font-awesome/css/all.min.css">
    <!-- Shared base (tokens, buttons, layout) + this page's own stylesheet -->
    <link rel="stylesheet" href="../main/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="../../icon.png">
    <link rel="stylesheet" href="../nav/sidebar.css">
    <!-- Large user data (userStories, savedWords, userDictionaries, …) is stored in IndexedDB via localForage; must load before page scripts. -->
    <script src="../nav/vendor/localforage.min.js"></script>
    <script src="../nav/storage.js"></script>
    <script src="../nav/sidebar.js" defer></script>
    <script src="../nav/common.js"></script>
    <link rel="stylesheet" href="../nav/theme.css">
    <link rel="stylesheet" href="../nav/header.css">
</head>

<body>

    <main class="main-content">
        <div class="container">
            <div id="profile-settings" class="page active profile-settings">

                    <header class="ist-header" id="top">
        <div class="ist-header__inner">
            <button class="ist-burger" id="toggle-nav" type="button" aria-label="Open navigation"
                aria-controls="istories-sidebar">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <a class="ist-header__brand" href="../../index.html">
                <img class="ist-header__logo" src="../../icon.svg" alt="">
                <span class="ist-header__name">IStories</span>
            </a>
            <span class="ist-header__page">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                <span>Profile</span>
            </span>
            <div class="ist-header__spacer"></div>
        </div>
    </header>

                <section class="profile-card">
                    <div class="profile-banner" aria-hidden="true"></div>

                    <div class="profile-body">
                        <!-- Photo Upload Area -->
                        <div class="photo-upload-container">
                            <div class="photo-frame">
                                <div class="photo-wrapper">
                                    <img src="../../imges/user.jpg" alt="Profile picture" class="profile-photo"
                                        id="profile-photo">
                                    <div class="photo-overlay" id="change-photo-btn" role="button" tabindex="0"
                                        aria-label="Change profile photo">
                                        <i class="fas fa-camera"></i>
                                        <span>Change</span>
                                    </div>
                                </div>
                                <!-- Always-visible camera button (works on touch too) -->
                                <label class="photo-camera-badge" for="photo-input" title="Change photo"
                                    aria-label="Change profile photo">
                                    <i class="fas fa-camera"></i>
                                </label>
                            </div>
                            <input type="file" id="photo-input" accept="image/*" hidden>
                            <p class="photo-hint">JPG or PNG, up to 5&nbsp;MB</p>
                            <button type="button" class="photo-remove" id="remove-photo-btn">Use default photo</button>
                        </div>

                        <!-- Name Input -->
                        <div class="name-input-container">
                            <div class="input-group">
                                <label for="profile-name-input" class="input-label">
                                    <i class="fas fa-user"></i>
                                    Your Name
                                </label>
                                <div class="input-with-icon">
                                    <input type="text" id="profile-name-input" class="name-input"
                                        placeholder="Enter your name" maxlength="50" autocomplete="name">
                                    <i class="fas fa-check input-valid-icon" id="name-valid-icon"></i>
                                </div>
                                <div class="input-meta">
                                    <p class="input-hint">This name is shown on your profile.</p>
                                    <span class="char-counter"><span id="name-char-count">0</span>/50</span>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="profile-actions">
                                <button type="button" class="btn-secondary" id="cancel-btn">
                                    <i class="fas fa-rotate-left"></i>
                                    Reset
                                </button>
                                <button type="button" class="btn-primary" id="save-btn">
                                    <i class="fas fa-save"></i>
                                    Save Changes
                                </button>
                            </div>
                            <p class="profile-status" id="profile-status" role="status" aria-live="polite"></p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        // Apply the saved theme/colors so the page matches the rest of the app.
        (function () {
            var t = localStorage.getItem('theme') || 'light';
            if (t === 'dark') document.body.classList.add('dark-mode');
            var root = document.documentElement;
            var pc = localStorage.getItem('selectedColor');
            var sc = localStorage.getItem('selectedSecondaryColor');
            if (pc) root.style.setProperty('--primary', pc);
            if (sc) root.style.setProperty('--secondary', sc);
        })();
    </script>
    <script src="script.js"></script>

</body>

</html>
