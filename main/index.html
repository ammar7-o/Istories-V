    <script>
        // Global variable to track if stories are loaded
        window.storiesLoaded = false;
        window.storiesData = [];

        // Function to get URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            if (results === null) return '';
            const raw = results[1].replace(/\+/g, ' ');
            try {
                // A single decode is intentional: the value is a URL, and any
                // escaped characters inside its path (for example %201 for a
                // space) must survive so the browser can request the file.
                return decodeURIComponent(raw);
            } catch (error) {
                return raw;
            }
        }

        // Function to save selected stories file to localStorage
        function saveSelectedStoriesFile(filename) {
            localStorage.setItem('selectedStoriesFile', filename);
            console.log('Saved stories file selection:', filename);
        }

        // Function to load saved stories file
        function loadSavedStoriesFile() {
            return localStorage.getItem('selectedStoriesFile') || 'stories/stories.json'; // Default file
        }

        // ------------------------------------------------------------------
        // Story source picker
        // The original <select> stays in the DOM as the source of truth, but
        // the hero button opens a popup with the same source list, a field for
        // adding a file URL, and a clearer mobile layout.
        // ------------------------------------------------------------------
        var CUSTOM_STORY_SOURCES_KEY = 'customStorySources';

        function sourcePickerText(key, fallback) {
            if (window.IStoriesI18n && typeof window.IStoriesI18n.t === 'function') {
                var value = window.IStoriesI18n.t(key);
                if (value && value !== key) return value;
            }
            return fallback;
        }

        function getSourceDisplayName(value, label) {
            if (label && String(label).trim()) return String(label).trim();
            var raw = String(value || '').trim();
            if (!raw) return sourcePickerText('library.sourcesTitle', 'Story source');
            try {
                var parsed = new URL(raw, window.location.href);
                var name = decodeURIComponent((parsed.pathname.split('/').pop() || '').trim());
                if (name) return name;
                return parsed.hostname || raw;
            } catch (error) {
                return raw;
            }
        }

        function getCustomStorySources() {
            try {
                var stored = JSON.parse(localStorage.getItem(CUSTOM_STORY_SOURCES_KEY)) || [];
                if (!Array.isArray(stored)) return [];
                return stored.filter(function (entry) {
                    return entry && typeof entry.url === 'string' && entry.url.trim();
                });
            } catch (error) {
                return [];
            }
        }

        function resolveSourceUrl(value) {
            try {
                return new URL(String(value || '').trim(), window.location.href);
            } catch (error) {
                return null;
            }
        }

        function isHttpSource(value) {
            var parsed = resolveSourceUrl(value);
            return !!parsed && (parsed.protocol === 'http:' || parsed.protocol === 'https:');
        }

        function isRemoteSource(value) {
            var parsed = resolveSourceUrl(value);
            return !!parsed && (parsed.protocol === 'http:' || parsed.protocol === 'https:') &&
                parsed.origin !== window.location.origin;
        }

        function sameSource(first, second) {
            if (String(first) === String(second)) return true;
            var a = resolveSourceUrl(first);
            var b = resolveSourceUrl(second);
            return !!a && !!b && a.href === b.href;
        }

        function findSourceOption(selectElement, value) {
            if (!selectElement || !value) return null;
            var options = Array.prototype.slice.call(selectElement.options);
            for (var i = 0; i < options.length; i++) {
                if (options[i].value === value) return options[i];
            }
            for (var j = 0; j < options.length; j++) {
                if (sameSource(options[j].value, value)) return options[j];
            }
            return null;
        }

        function createSourceOption(selectElement, value, label, isCustom) {
            if (!selectElement) return null;
            var option = document.createElement('option');
            option.value = value;
            option.textContent = getSourceDisplayName(value, label);
            if (isCustom) option.dataset.customSource = 'true';
            selectElement.appendChild(option);
            return option;
        }

        function saveCustomStorySource(url) {
            if (!isHttpSource(url)) return;
            var sources = getCustomStorySources();
            var exists = sources.some(function (entry) { return sameSource(entry.url, url); });
            if (exists) return;
            sources.push({ url: url, label: getSourceDisplayName(url, '') });
            try {
                localStorage.setItem(CUSTOM_STORY_SOURCES_KEY, JSON.stringify(sources));
            } catch (error) {
                console.warn('Could not save custom story source:', error);
            }
        }

        function appendCustomStorySources(selectElement) {
            if (!selectElement) return;
            getCustomStorySources().forEach(function (entry) {
                if (findSourceOption(selectElement, entry.url)) return;
                createSourceOption(selectElement, entry.url, entry.label, true);
            });
        }

        function sourcePickerError(message) {
            var errorElement = document.getElementById('sourcePickerError');
            if (!errorElement) return;
            errorElement.textContent = message || '';
            errorElement.hidden = !message;
        }

        function buildSourceGroup(config) {
            var group = document.createElement('section');
            group.className = 'source-picker-group';

            var head = document.createElement('div');
            head.className = 'source-picker-group__head';

            var title = document.createElement('h4');
            title.className = 'source-picker-group__title';

            var titleIcon = document.createElement('i');
            titleIcon.className = 'fas ' + config.icon;
            titleIcon.setAttribute('aria-hidden', 'true');

            var titleText = document.createElement('span');
            titleText.textContent = config.title;

            title.appendChild(titleIcon);
            title.appendChild(titleText);
            head.appendChild(title);

            if (config.entries.length) {
                var count = document.createElement('span');
                count.className = 'source-picker-group__count';
                count.textContent = String(config.entries.length);
                head.appendChild(count);
            }

            group.appendChild(head);

            if (!config.entries.length) {
                var empty = document.createElement('p');
                empty.className = 'source-picker-empty';
                empty.textContent = config.emptyText;
                group.appendChild(empty);
                return group;
            }

            var entries = document.createElement('div');
            entries.className = 'source-picker-entries';

            config.entries.forEach(function (entry) {
                var option = entry.option;
                var isActive = sameSource(option.value, config.selectedValue);
                var row = document.createElement('div');
                row.className = 'source-picker-entry' + (isActive ? ' is-active' : '');

                var item = document.createElement('button');
                item.type = 'button';
                item.className = 'source-picker-item' + (isActive ? ' is-active' : '');
                item.dataset.sourceValue = option.value;

                var icon = document.createElement('span');
                icon.className = 'source-picker-item__icon';
                var iconElement = document.createElement('i');
                iconElement.className = 'fas ' +
                    (entry.custom || isRemoteSource(option.value) ? 'fa-globe' : 'fa-database');
                iconElement.setAttribute('aria-hidden', 'true');
                icon.appendChild(iconElement);
                item.appendChild(icon);

                var body = document.createElement('span');
                body.className = 'source-picker-item__body';

                var label = document.createElement('span');
                label.className = 'source-picker-item__label';
                label.dir = 'auto';
                label.textContent = getSourceDisplayName(option.value, option.textContent);
                body.appendChild(label);

                var metaText = '';
                if (entry.custom) {
                    var parsed = resolveSourceUrl(option.value);
                    metaText = parsed ? parsed.hostname : '';
                    if (!metaText) metaText = sourcePickerText('library.importedBadge', 'Imported');
                } else if (isRemoteSource(option.value)) {
                    metaText = sourcePickerText('library.builtInBadge', 'Built-in');
                }
                if (metaText) {
                    var meta = document.createElement('span');
                    meta.className = 'source-picker-item__meta';
                    meta.dir = 'ltr';
                    meta.textContent = metaText;
                    body.appendChild(meta);
                }

                item.appendChild(body);

                var check = document.createElement('i');
                check.className = 'fas fa-check source-picker-item__check';
                check.setAttribute('aria-hidden', 'true');
                item.appendChild(check);

                item.addEventListener('click', function () {
                    chooseStorySource(option.value);
                });
                row.appendChild(item);

                if (entry.custom) {
                    var removeButton = document.createElement('button');
                    removeButton.type = 'button';
                    removeButton.className = 'source-picker-remove';
                    var removeTitle = sourcePickerText('library.removeSource', 'Remove saved base');
                    removeButton.title = removeTitle;
                    removeButton.setAttribute('aria-label', removeTitle + ': ' + label.textContent);
                    var removeIcon = document.createElement('i');
                    removeIcon.className = 'fas fa-trash';
                    removeIcon.setAttribute('aria-hidden', 'true');
                    removeButton.appendChild(removeIcon);
                    removeButton.addEventListener('click', function (event) {
                        event.stopPropagation();
                        removeCustomStorySource(option.value);
                    });
                    row.appendChild(removeButton);
                }

                entries.appendChild(row);
            });

            group.appendChild(entries);
            return group;
        }

        function refreshSourcePicker() {
            var selectElement = document.getElementById('Select');
            var listElement = document.getElementById('sourcePickerList');
            var labelElement = document.getElementById('sourcePickerLabel');
            if (!selectElement) return;

            var selectedValue = selectElement.value;
            var selectedOption = findSourceOption(selectElement, selectedValue);
            var options = Array.prototype.slice.call(selectElement.options);

            if (labelElement) {
                labelElement.textContent = selectedOption
                    ? getSourceDisplayName(selectedOption.value, selectedOption.textContent)
                    : getSourceDisplayName(selectedValue, '');
            }

            if (!listElement) return;
            listElement.innerHTML = '';

            var offlineEntries = [];
            var onlineEntries = [];

            options.forEach(function (option) {
                var entry = {
                    option: option,
                    custom: option.dataset.customSource === 'true'
                };
                if (entry.custom || isRemoteSource(option.value)) onlineEntries.push(entry);
                else offlineEntries.push(entry);
            });

            if (offlineEntries.length) {
                listElement.appendChild(buildSourceGroup({
                    title: sourcePickerText('library.offlineBases', 'Offline bases'),
                    icon: 'fa-hard-drive',
                    entries: offlineEntries,
                    selectedValue: selectedValue,
                    emptyText: ''
                }));
            }

            listElement.appendChild(buildSourceGroup({
                title: sourcePickerText('library.onlineBases', 'Your online bases'),
                icon: 'fa-cloud',
                entries: onlineEntries,
                selectedValue: selectedValue,
                emptyText: sourcePickerText('library.onlineBasesEmpty',
                    'No online bases saved yet. Add one below or browse the database.')
            }));
        }

        function removeCustomStorySource(url) {
            var selectElement = document.getElementById('Select');
            if (!selectElement) return;

            var sources = getCustomStorySources().filter(function (entry) {
                return !sameSource(entry.url, url);
            });
            try {
                localStorage.setItem(CUSTOM_STORY_SOURCES_KEY, JSON.stringify(sources));
            } catch (error) {
                console.warn('Could not update custom story sources:', error);
            }

            var wasSelected = false;
            Array.prototype.slice.call(selectElement.options).forEach(function (option) {
                if (option.dataset.customSource !== 'true') return;
                if (!sameSource(option.value, url)) return;
                if (sameSource(option.value, selectElement.value)) wasSelected = true;
                option.remove();
            });

            // If the removed base was the one on screen, switch to the first
            // remaining base instead of leaving the hidden <select> empty.
            if (wasSelected && selectElement.options.length) {
                selectElement.selectedIndex = 0;
                selectElement.dispatchEvent(new Event('change', { bubbles: true }));
                return;
            }

            refreshSourcePicker();
        }

        function chooseStorySource(value) {
            var selectElement = document.getElementById('Select');
            if (!selectElement) return;
            var option = findSourceOption(selectElement, value);
            if (!option) return;

            selectElement.value = option.value;
            refreshSourcePicker();
            closeSourcePicker();
            selectElement.dispatchEvent(new Event('change', { bubbles: true }));
        }

        var sourcePickerLastFocus = null;

        function openSourcePicker() {
            var modal = document.getElementById('sourcePickerModal');
            var button = document.getElementById('sourcePickerButton');
            if (!modal) return;

            sourcePickerLastFocus = document.activeElement;
            sourcePickerError('');
            refreshSourcePicker();
            modal.hidden = false;
            if (button) button.setAttribute('aria-expanded', 'true');

            var focusTarget = modal.querySelector('.source-picker-item.is-active') ||
                modal.querySelector('.source-picker-item');
            if (focusTarget) {
                focusTarget.focus();
            } else {
                var urlInput = document.getElementById('sourcePickerUrl');
                if (urlInput) urlInput.focus();
            }
        }

        function closeSourcePicker() {
            var modal = document.getElementById('sourcePickerModal');
            var button = document.getElementById('sourcePickerButton');
            if (!modal || modal.hidden) return;

            modal.hidden = true;
            if (button) button.setAttribute('aria-expanded', 'false');
            if (sourcePickerLastFocus && typeof sourcePickerLastFocus.focus === 'function') {
                sourcePickerLastFocus.focus();
            }
        }

        function addStorySourceFromUrl() {
            var input = document.getElementById('sourcePickerUrl');
            var selectElement = document.getElementById('Select');
            if (!input || !selectElement) return;

            var raw = input.value.trim();
            if (!raw) {
                sourcePickerError(sourcePickerText('library.sourceInvalid',
                    'Enter a valid http(s) file URL.'));
                input.focus();
                return;
            }

            var resolved;
            try {
                resolved = new URL(raw, window.location.href);
            } catch (error) {
                sourcePickerError(sourcePickerText('library.sourceInvalid',
                    'Enter a valid http(s) file URL.'));
                input.focus();
                return;
            }

            if (resolved.protocol !== 'http:' && resolved.protocol !== 'https:') {
                sourcePickerError(sourcePickerText('library.sourceInvalid',
                    'Enter a valid http(s) file URL.'));
                input.focus();
                return;
            }

            sourcePickerError('');

            var existingOption = findSourceOption(selectElement, raw) ||
                findSourceOption(selectElement, resolved.href);

            if (existingOption) {
                input.value = '';
                chooseStorySource(existingOption.value);
                return;
            }

            createSourceOption(selectElement, resolved.href, '', true);
            saveCustomStorySource(resolved.href);
            input.value = '';
            chooseStorySource(resolved.href);
        }

        function setupSourcePicker() {
            var button = document.getElementById('sourcePickerButton');
            var modal = document.getElementById('sourcePickerModal');
            var closeButton = document.getElementById('sourcePickerClose');
            var form = document.getElementById('sourcePickerForm');
            if (!button || !modal) return;

            button.addEventListener('click', openSourcePicker);
            if (closeButton) closeButton.addEventListener('click', closeSourcePicker);
            modal.addEventListener('click', function (event) {
                if (event.target === modal) closeSourcePicker();
            });
            if (form) {
                form.addEventListener('submit', function (event) {
                    event.preventDefault();
                    addStorySourceFromUrl();
                });
            }
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && !modal.hidden) closeSourcePicker();
            });
        }

        function finalizeSourceOptions() {
            appendCustomStorySources(document.getElementById('Select'));
            refreshSourcePicker();
        }

        // Function to initialize app after stories are loaded
        function initAppAfterStoriesLoad() {
            if (window.storiesLoaded) {
                if (typeof init === 'function') {
                    if (window.IStoriesStorage) IStoriesStorage.whenReady(function () { init(); });
                    else init();
                }
            } else {
                console.log('Waiting for stories to load...');
                setTimeout(initAppAfterStoriesLoad, 100);
            }
        }

        // Function to load stories based on selected file
        function loadStoriesFile(filename) {
            // Reset loaded state
            window.storiesLoaded = false;

            // Remove old script if exists
            const oldScript = document.querySelector('script[data-stories="true"]');
            if (oldScript) {
                oldScript.remove();
            }

            console.log(`Loading stories from: ${filename}`);

            // Create and load new script
            const s = document.createElement("script");
            s.src = filename;
            s.setAttribute('data-stories', 'true');

            s.onload = function () {
                console.log('Stories loaded successfully');
                console.log('Stories data:', window.storiesData);
                window.storiesLoaded = true;

                // Save the selected file
                saveSelectedStoriesFile(filename);

                // Initialize app
                initAppAfterStoriesLoad();
            };

            s.onerror = function () {
                console.error(`Failed to load ${filename}`);
                // Use fallback stories
                window.storiesData = {
                    stories: [
                        {
                            id: 1,
                            title: "The Mysterious Island",
                            level: "beginner",
                            cover: "🏝️",
                            coverType: "emoji",
                            wordCount: 350,
                            content: ["This is a sample story. Click on words like village or journey to see the dictionary."]
                        }
                    ]
                };
                window.storiesLoaded = true;

                // Save the selected file (even if error, user chose it)
                saveSelectedStoriesFile(filename);

                // Initialize app with fallback
                initAppAfterStoriesLoad();
            };

            document.head.appendChild(s);
        }

        // Function to update URL with selected story
        function updateURLWithStory(storyFile) {
            const url = new URL(window.location.href);
            url.searchParams.set('story', storyFile);
            window.history.replaceState({}, '', url);
        }

        // Function to set select element value based on filename
        function setSelectValue(filename) {
            const selectElement = document.getElementById('Select');
            if (!selectElement) return false;

            for (let option of selectElement.options) {
                if (option.value === filename) {
                    selectElement.value = filename;
                    return true;
                }
            }
            return false;
        }

        // Function to get stories file from URL or storage
        function getStoriesFileToLoad() {
            // Check URL parameter first (support both 'story' and 'file' parameters)
            const urlStoryFile = getUrlParameter('story') || getUrlParameter('file');

            if (urlStoryFile) {
                console.log('Found story file in URL:', urlStoryFile);
                return urlStoryFile;
            }

            // Fallback to localStorage
            return loadSavedStoriesFile();
        }

        // Handler for select change events
        function selectChangeHandler(e) {
            const selectedFile = e.target.value;
            console.log(`File changed to: ${selectedFile}`);

            // Update URL with the selected file
            updateURLWithStory(selectedFile);
            refreshSourcePicker();

            // Load the stories file
            loadStoriesFile(selectedFile);
        }

        // Set up the select element event listener
        function setupSelectListener() {
            const selectElement = document.getElementById('Select');
            if (selectElement) {
                // Remove any existing listeners to avoid duplicates
                selectElement.removeEventListener('change', selectChangeHandler);
                // Add the change handler
                selectElement.addEventListener('change', selectChangeHandler);
            }
        }

        // Load initial stories
        function loadInitialStories() {
            // Setup the select listener
            setupSelectListener();

            const selectElement = document.getElementById('Select');
            const urlStoryFile = getUrlParameter('story') || getUrlParameter('file');
            let fileToLoad = urlStoryFile || loadSavedStoriesFile();

            if (selectElement && fileToLoad) {
                let sourceOption = findSourceOption(selectElement, fileToLoad);

                // A ?story= link can point at a database that is not in the
                // built-in list yet. Add it (and remember it when it is an
                // online URL) instead of silently falling back to Base-1.
                if (!sourceOption && urlStoryFile) {
                    const isOnlineSource = /^(https?:)?\/\//i.test(urlStoryFile) && isHttpSource(urlStoryFile);
                    sourceOption = createSourceOption(selectElement, urlStoryFile, '', isOnlineSource);
                    if (isOnlineSource) saveCustomStorySource(urlStoryFile);
                    console.log('Added story file from URL to sources:', urlStoryFile);
                }

                if (sourceOption) {
                    selectElement.value = sourceOption.value;
                    fileToLoad = sourceOption.value;
                    console.log('Using stories file:', fileToLoad);
                } else {
                    // The stored selection is stale (for example a base that
                    // was removed). Fall back to the first available base.
                    selectElement.selectedIndex = 0;
                    fileToLoad = selectElement.value;
                    console.log('Requested file not found in options, using:', fileToLoad);
                }
            }

            if (!fileToLoad) fileToLoad = 'stories/stories.json';

            refreshSourcePicker();
            updateURLWithStory(fileToLoad);
            loadStoriesFile(fileToLoad);
        }

        // Helper function to get shareable link for current story
        function getCurrentShareableLink() {
            const currentFile = document.getElementById('Select')?.value || 'stories/stories.json';
            return `${window.location.origin}${window.location.pathname}?story=${encodeURIComponent(currentFile)}`;
        }

        // Helper function to open a specific story file programmatically
        function openStoryFile(filename) {
            const selectElement = document.getElementById('Select');
            if (selectElement) {
                // Check if the file exists in options
                let optionExists = false;
                for (let option of selectElement.options) {
                    if (option.value === filename) {
                        optionExists = true;
                        break;
                    }
                }

                if (optionExists) {
                    selectElement.value = filename;
                }
            }

            // Update URL and load the file
            updateURLWithStory(filename);
            refreshSourcePicker();
            loadStoriesFile(filename);
        }

        // Populate the story-source <select> from database/data.json so new
        // options can be added by editing that file. Falls back to the built-in
        // <option>s if the data file can't be loaded.
        function populateSelectFromData(done) {
            var selectElement = document.getElementById('Select');
            fetch('../database/data.json')
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (entries) {
                    if (!selectElement || !Array.isArray(entries) || entries.length === 0) {
                        finalizeSourceOptions();
                        done();
                        return;
                    }
                    selectElement.innerHTML = '';
                    entries.forEach(function (entry) {
                        var file = entry && (entry.file || entry.value);
                        if (!file) return;
                        var raw = String(file).trim();
                        var opt = document.createElement('option');
                        if (/^(https?:)?\/\//i.test(raw)) {
                            // Absolute URL — use as-is
                            opt.value = raw;
                        } else {
                            // Relative to the story-source folder (database/database/).
                            // A leading "/" (e.g. "/A1/more.js") is ignored so the
                            // value still resolves inside that folder.
                            opt.value = '../database/database/' + raw.replace(/^\/+/, '');
                        }
                        opt.textContent = entry.label || raw.split('/').pop();
                        selectElement.appendChild(opt);
                    });
                    finalizeSourceOptions();
                    done();
                })
                .catch(function () {
                    finalizeSourceOptions();
                    done(); // keep the hardcoded fallback options
                });
        }

        // Load initial stories when page loads (after the select is populated)
        document.addEventListener('DOMContentLoaded', function () {
            setupSourcePicker();
            populateSelectFromData(loadInitialStories);
        });

    </script>
