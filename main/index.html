            </a>
            <span class="ist-header__page">

            </span>
            <div class="ist-header__spacer"></div>
            <form id="search-form" class="ist-header__search" action="#">
                <i class="fa-solid fa-magnifying-glass ist-header__search-icon" aria-hidden="true"></i>

<main class="main-content">

                <section class="hero">

<div class="profile">

                            <img src="../imges/user.jpg" alt="Profile Picture" id="profile-pic">

                            <h2 id="profile-name">Your name</h2>
                        </div>

<!-- Stats -->
                        <div class="user-stats">

                                <div class="stat-label">XP</div>
                            </div>
                            <div class="stat-item words-u">
                                <i class="fas fa-language"></i>

                                <div class="stat-label">Words</div>
                            </div>
                            <div class="stat-item level-u">
                                <i class="fas fa-trophy "></i>
                                <div class="stat-value" id="level">12h</div>
                                <div class="stat-label">Level</div>
                            </div>
                            <div class="stat-item  Streak">
                                <i class="fas fa-fire"></i>
                                <div class="stat-value" id="streak-count">5</div>
                                <div class="stat-label">days</div>
                            </div>
                        </div>

</div>

                    <div class="hero-btns">
                        <button id="randomStory" class="cta-button"> <i class="fas fa-random"></i> Random Story</button>
                        <button class="cta-button" onclick="showRecentStories()">
                            <i class="fas fa-history"></i> Recent Stories

                        <select class="hero-select" name="" id="Select">

                </section>
                <div class="stories-parametres">

                        <option class="level-btn" data-level="beginner" value="beginner">Beginner</option>
                        <option class="level-btn" data-level="intermediate" value="intermediate">Intermediate</option>
                        <option class="level-btn" data-level="advanced" value="advanced">Advanced</option>
                        <option class="level-btn" data-level="user" value="user">User</option>
                    </select>
                    <select class="stories-select" id="langFilter" aria-label="Filter stories by language">
                        <option value="all">🌍 All languages</option>
                    </select>
                </div>

<div class="stories-grid" id="storiesGrid">
                    <!-- Stories will be populated by JavaScript -->
                </div>
            </div>

</div>

    <!-- Custom CSS Modal (add at bottom of settings page) -->
    
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="logo">
                    <img src="../icon.svg" alt="">
                    <span>IStories</span>
                </div>
                <div class="footer-links">
                    <a target="_blank" href="https://ammar7-o.github.io/RAME/#">About</a>

                </div>
            </div>
        </div>
    </footer>
    <script>
        // Global variable to track if stories are loaded
        window.storiesLoaded = false;
        window.storiesData = [];

        // Function to get URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Function to save selected stories file to localStorage
        function saveSelectedStoriesFile(filename) {
            localStorage.setItem('selectedStoriesFile', filename);
            console.log('Saved stories file selection:', filename);
        }

        // Function to load saved stories file
        function loadSavedStoriesFile() {
            return localStorage.getItem('selectedStoriesFile') || 'stories/stories.json'; // Default file
        }

        // Function to initialize app after stories are loaded
        function initAppAfterStoriesLoad() {
            if (window.storiesLoaded) {
                if (typeof init === 'function') {
                    if (window.IStoriesStorage) IStoriesStorage.whenReady(function () { init(); });
                    else init();
                }
            } else {
                console.log('Waiting for stories to load...');
                setTimeout(initAppAfterStoriesLoad, 100);
            }
        }

        // Function to load stories based on selected file
        function loadStoriesFile(filename) {
            // Reset loaded state
            window.storiesLoaded = false;

            // Remove old script if exists
            const oldScript = document.querySelector('script[data-stories="true"]');
            if (oldScript) {
                oldScript.remove();
            }

            console.log(`Loading stories from: ${filename}`);

            // Create and load new script
            const s = document.createElement("script");
            s.src = filename;
            s.setAttribute('data-stories', 'true');

            s.onload = function () {
                console.log('Stories loaded successfully');
                console.log('Stories data:', window.storiesData);
                window.storiesLoaded = true;

                // Save the selected file
                saveSelectedStoriesFile(filename);

                // Initialize app
                initAppAfterStoriesLoad();
            };

            s.onerror = function () {
                console.error(`Failed to load ${filename}`);
                // Use fallback stories
                window.storiesData = {
                    stories: [
                        {
                            id: 1,
                            title: "The Mysterious Island",
                            level: "beginner",
                            cover: "🏝️",
                            coverType: "emoji",
                            wordCount: 350,
                            content: ["This is a sample story. Click on words like village or journey to see the dictionary."]
                        }
                    ]
                };
                window.storiesLoaded = true;

                // Save the selected file (even if error, user chose it)
                saveSelectedStoriesFile(filename);

                // Initialize app with fallback
                initAppAfterStoriesLoad();
            };

            document.head.appendChild(s);
        }

        // Function to update URL with selected story
        function updateURLWithStory(storyFile) {
            const url = new URL(window.location.href);
            url.searchParams.set('story', storyFile);
            window.history.replaceState({}, '', url);
        }

        // Function to set select element value based on filename
        function setSelectValue(filename) {
            const selectElement = document.getElementById('Select');
            if (!selectElement) return false;

            for (let option of selectElement.options) {
                if (option.value === filename) {
                    selectElement.value = filename;
                    return true;
                }
            }
            return false;
        }

        // Function to get stories file from URL or storage
        function getStoriesFileToLoad() {
            // Check URL parameter first (support both 'story' and 'file' parameters)
            const urlStoryFile = getUrlParameter('story') || getUrlParameter('file');

            if (urlStoryFile) {
                console.log('Found story file in URL:', urlStoryFile);
                return urlStoryFile;
            }

            // Fallback to localStorage
            return loadSavedStoriesFile();
        }

        // Handler for select change events
        function selectChangeHandler(e) {
            const selectedFile = e.target.value;
            console.log(`File changed to: ${selectedFile}`);

            // Update URL with the selected file
            updateURLWithStory(selectedFile);

            // Load the stories file
            loadStoriesFile(selectedFile);
        }

        // Set up the select element event listener
        function setupSelectListener() {
            const selectElement = document.getElementById('Select');
            if (selectElement) {
                // Remove any existing listeners to avoid duplicates
                selectElement.removeEventListener('change', selectChangeHandler);
                // Add the change handler
                selectElement.addEventListener('change', selectChangeHandler);
            }
        }

        // Load initial stories
        function loadInitialStories() {
            // Setup the select listener
            setupSelectListener();

            // Get the file to load (from URL or localStorage)
            const fileToLoad = getStoriesFileToLoad();

            // Set the select element value if the file exists in options
            const selectElement = document.getElementById('Select');
            if (selectElement) {
                let optionExists = false;
                for (let option of selectElement.options) {
                    if (option.value === fileToLoad) {
                        optionExists = true;
                        break;
                    }
                }

                if (optionExists) {
                    selectElement.value = fileToLoad;
                    console.log('Using stories file:', fileToLoad);
                } else {
                    // If file doesn't exist in options, use the default selected option
                    const initialFile = selectElement.value;
                    console.log('Requested file not found in options, using:', initialFile);

                    // Update URL to reflect the actual file being loaded
                    updateURLWithStory(initialFile);

                    // Load the initial file
                    loadStoriesFile(initialFile);
                    return; // Exit early as we're loading here
                }
            }

            // Load the stories file
            loadStoriesFile(fileToLoad);
        }

        // Helper function to get shareable link for current story
        function getCurrentShareableLink() {
            const currentFile = document.getElementById('Select')?.value || 'stories/stories.json';
            return `${window.location.origin}${window.location.pathname}?story=${encodeURIComponent(currentFile)}`;
        }

        // Helper function to open a specific story file programmatically
        function openStoryFile(filename) {
            const selectElement = document.getElementById('Select');
            if (selectElement) {
                // Check if the file exists in options
                let optionExists = false;
                for (let option of selectElement.options) {
                    if (option.value === filename) {
                        optionExists = true;
                        break;
                    }
                }

                if (optionExists) {
                    selectElement.value = filename;
                }
            }

            // Update URL and load the file
            updateURLWithStory(filename);
            loadStoriesFile(filename);
        }

        // Populate the story-source <select> from database/data.json so new
        // options can be added by editing that file. Falls back to the built-in
        // <option>s if the data file can't be loaded.
        function populateSelectFromData(done) {
            var selectElement = document.getElementById('Select');
            fetch('../database/data.json')
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (entries) {
                    if (!selectElement || !Array.isArray(entries) || entries.length === 0) {
                        done();
                        return;
                    }
                    selectElement.innerHTML = '';
                    entries.forEach(function (entry) {
                        var file = entry && (entry.file || entry.value);
                        if (!file) return;
                        var raw = String(file).trim();
                        var opt = document.createElement('option');
                        if (/^(https?:)?\/\//i.test(raw)) {
                            // Absolute URL — use as-is
                            opt.value = raw;
                        } else {
                            // Relative to the story-source folder (database/database/).
                            // A leading "/" (e.g. "/A1/more.js") is ignored so the
                            // value still resolves inside that folder.
                            opt.value = '../database/database/' + raw.replace(/^\/+/, '');
                        }
                        opt.textContent = entry.label || raw.split('/').pop();
                        selectElement.appendChild(opt);
                    });
                    done();
                })
                .catch(function () {
                    done(); // keep the hardcoded fallback options
                });
        }

        // Load initial stories when page loads (after the select is populated)
        document.addEventListener('DOMContentLoaded', function () {
            populateSelectFromData(loadInitialStories);
        });

    </script>

<script src="main/other.js"></script>
    <script src="main/main.js"></script>
