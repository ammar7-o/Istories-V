<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istories Download stories</title>
    <link rel="stylesheet" href="../font-awesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="../icon.png?v=2">
    <meta property="og:title" content="Istories">
    <meta property="og:description" content="Learn Languages Through Interactive Stories.">
    <meta property="og:image" content="https://ammar7-o.github.io/Istories-V/icon.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ammar7-o.github.io/Istories-V/">

    <!-- Shared sidebar navigation (nav/sidebar.js) -->
    <link rel="stylesheet" href="../main/nav/sidebar.css">
    <!-- Large user data (userStories, savedWords, userDictionaries, …) is stored in IndexedDB via localForage; must load before page scripts. -->
    <script src="../main/nav/vendor/localforage.min.js"></script>
    <script src="../main/nav/storage.js"></script>
    <script src="../main/nav/sidebar.js" defer></script>
    <script src="../main/nav/common.js"></script>
    <link rel="stylesheet" href="../main/nav/theme.css">
    <link rel="stylesheet" href="../main/nav/header.css">
</head>

<body>
        <header class="ist-header" id="top">
        <div class="ist-header__inner">
            <button class="ist-burger" id="toggle-nav" type="button" aria-label="Open navigation"
                aria-controls="istories-sidebar">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <a class="ist-header__brand" href="../index.html">
                <img class="ist-header__logo" src="../icon.svg" alt="">
                <span class="ist-header__name">IStories</span>
            </a>
            <span class="ist-header__page">
                <i class="fa-solid fa-store" aria-hidden="true"></i>
                <span>Story Store</span>
            </span>
            <div class="ist-header__spacer"></div>
            <form id="search-form" class="ist-header__search" action="#">
                <i class="fa-solid fa-magnifying-glass ist-header__search-icon" aria-hidden="true"></i>
                <input class="search-input" id="storySearch" type="text" placeholder="Search" autocomplete="off">
                <button id="search-btn" class="ist-header__search-btn" type="submit" aria-label="Search">
                    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
            </form>
            <a class="ist-header__action" id="settings-button" href="../main/settings/index.html" aria-label="Settings"
                title="Settings">
                <i class="fa-solid fa-gear" aria-hidden="true"></i>
            </a>
        </div>
    </header>

<main class="main-content">
        <div class="container">
            <!-- Home Page -->
            <div id="home" class="page active">
                <section class="hero">
                    <select name="" id="Select">
                        <option value="stories.js">English-1</option>
                        <option value="stories2.js">English-2</option>

                    </select>
                </section>

                <div class="level-filter">
                    <button class="level-btn active" data-level="all">All Levels</button>
                    <button class="level-btn" data-level="beginner">Beginner</button>
                    <button class="level-btn" data-level="intermediate">Intermediate</button>
                    <button class="level-btn" data-level="advanced">Advanced</button>
                </div>

                <div class="store-lang-filter">
                    <select class="stories-select" id="langFilter" aria-label="Filter stories by language">
                        <option value="all">🌍 All languages</option>
                    </select>
                </div>

                <div class="stories-grid" id="storiesGrid">
                    <!-- Stories will be populated by JavaScript -->
                </div>
            </div>
        </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="logo">
                    <img src="../icon.svg" alt="">
                    <span>IStories</span>
                </div>
                <div class="footer-links">
                    <a target="_blank" href="https://ammar7-o.github.io/RAME/#">About</a>

                </div>
            </div>
        </div>
    </footer>

    <script>
        // Global variable to track if stories are loaded
        window.storiesLoaded = false;
        window.storiesData = [];

        // Function to initialize app after stories are loaded
        function initAppAfterStoriesLoad() {
            if (window.storiesLoaded) {
                if (window.IStoriesStorage) IStoriesStorage.whenReady(function () { init(); });
                else init();
            } else {
                console.log('Waiting for stories to load...');
                setTimeout(initAppAfterStoriesLoad, 100);
            }
        }

        // Function to load stories based on selected file
        function loadStoriesFile(filename) {
            // Reset loaded state
            window.storiesLoaded = false;

            // Remove old script if exists
            const oldScript = document.querySelector('script[data-stories="true"]');
            if (oldScript) {
                oldScript.remove();
            }

            console.log(`Loading stories from: ${filename}`);

            // Create and load new script
            const s = document.createElement("script");
            s.src = filename;
            s.setAttribute('data-stories', 'true');

            s.onload = function () {
                console.log('Stories loaded successfully');
                console.log('Stories data:', window.storiesData);
                window.storiesLoaded = true;
                // Initialize app
                initAppAfterStoriesLoad();
            };

            s.onerror = function () {
                console.error(`Failed to load ${filename}`);
                // Use fallback stories
                window.storiesData = {
                    stories: [
                        {
                            id: 1,
                            title: "The Mysterious Island",
                            level: "beginner",
                            cover: "🏝️",
                            coverType: "emoji",
                            wordCount: 350,
                            content: ["This is a sample story. Click on words like village or journey to see the dictionary."]
                        }
                    ]
                };
                window.storiesLoaded = true;
                // Initialize app with fallback
                initAppAfterStoriesLoad();
            };

            document.head.appendChild(s);
        }

        // Add event listener to select element
        document.getElementById('Select').addEventListener('change', function (e) {
            const selectedFile = e.target.value;
            console.log(`File changed to: ${selectedFile}`);
            loadStoriesFile(selectedFile);
        });

        // Load initial stories based on default selection
        const initialFile = document.getElementById('Select').value;
        loadStoriesFile(initialFile);
    </script>
    <!-- <script src="stories.js"></script> -->

    <script src="main.js"></script>

</body>

</html>
